---
# notes on the sample exams, mostly where the tasks and the grading
# scripts disagree - for reading on the node while working on the exam
- name: Copy sample exam notes to course user's home
  ansible.builtin.copy:
    # in the repo root, so it can be read on GitHub without a cluster
    src: "{{ playbook_dir }}/../NOTES_SAMPLE_EXAMS.md"
    dest: "/home/{{ course_user }}/NOTES_SAMPLE_EXAMS.md"
    owner: "{{ course_user }}"
    group: "{{ course_user }}"
    mode: "0644"
