---
- name: Run course setup scripts
  block:
    # only so setup-container.sh's "ln -s ... /etc/apparmor.d/disable/"
    # doesn't fail (missing on Hetzner's 26.04 image). The runc profile it
    # disables doesn't matter here anyway: it attaches to the distro's
    # /usr/{bin,sbin}/runc, while the script installs /usr/local/sbin/runc,
    # which runs unconfined either way
    - name: Create apparmor disable directory
      ansible.builtin.file:
        path: /etc/apparmor.d/disable
        state: directory
        mode: "0755"

    - name: Run setup-container.sh
      ansible.builtin.command:
        cmd: ./setup-container.sh
        chdir: "{{ course_repo_dest }}"
        # not /tmp/container.txt (the script's own marker) - /tmp is
        # wiped on reboot and the script would run again. runc is the last
        # binary the script fetches, so a silently failed download (e.g. the
        # GitHub API not returning a release tag) gets retried on the next run
        creates: /usr/local/sbin/runc

    # the scripts never exit non-zero, so check the result explicitly.
    # Without runc containerd still runs, but no container can start
    - name: Check runc is installed
      ansible.builtin.command: /usr/local/sbin/runc --version
      changed_when: false
      check_mode: false

    - name: Ensure containerd is running
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true

    # setup-kubetools*.sh refuses to run without it, and it's gone if the
    # node was rebooted after setup-container.sh
    - name: Ensure setup-container.sh marker exists
      ansible.builtin.file:
        path: /tmp/container.txt
        state: touch
        modification_time: preserve
        access_time: preserve

    - name: Run {{ course_kubetools_script }}
      ansible.builtin.command:
        cmd: "./{{ course_kubetools_script }}"
        chdir: "{{ course_repo_dest }}"
        creates: /usr/bin/kubeadm

    # the script assumes crictl comes in as a kubeadm dependency, which the
    # pkgs.k8s.io packages no longer pull in - its final "crictl config"
    # then fails with "sudo: 'crictl': command not found". The package comes
    # from the pkgs.k8s.io repo the script just added
    - name: Install cri-tools
      apt:
        name: cri-tools
        state: present
        update_cache: true
        cache_valid_time: 3600

    # what the script's failed "crictl config --set runtime-endpoint=..."
    # would have written
    - name: Configure crictl runtime endpoint
      ansible.builtin.copy:
        dest: /etc/crictl.yaml
        content: |
          runtime-endpoint: unix:///run/containerd/containerd.sock
        mode: "0644"

    # the scripts run as root and download their tarballs into the repo
    - name: Hand course repository back to course user
      ansible.builtin.file:
        path: "{{ course_repo_dest }}"
        owner: "{{ course_user }}"
        group: "{{ course_user }}"
        recurse: true

    - name: Check kubeadm is installed
      ansible.builtin.command: kubeadm version -o short
      changed_when: false
      check_mode: false
