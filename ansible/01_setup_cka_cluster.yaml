---
- name: Load inventory from Terraform
  import_playbook: playbooks/00_setup_inventory.yaml

- name: Upgrade Ubuntu
  hosts: control_nodes:worker_nodes
  become: true
  # the venv custom_ansible_venv creates (and group_vars/all's global
  # ansible_python_interpreter default) doesn't exist yet at this point
  vars:
    ansible_python_interpreter: /usr/bin/python3
  roles:
    - role: upgrade_ubuntu

- name: Create ansible venv
  hosts: control_nodes:worker_nodes
  become: true
  # same as above - this play is what creates the venv in the first place
  vars:
    ansible_python_interpreter: /usr/bin/python3
  roles:
    - role: custom_ansible_venv

- name: Configure Linux Kenel Settings
  hosts: control_nodes:worker_nodes
  become: true
  roles:
    - role: configure_linux_kernel_settings

- name: Configure /etc/hosts
  hosts: control_nodes:worker_nodes
  become: true
  roles:
    - role: configure_etc_hosts

- name: Clone course repository
  hosts: control_nodes:worker_nodes
  become: true
  roles:
    - role: clone_course_repo

- name: Run course setup scripts
  hosts: control_nodes:worker_nodes
  become: true
  roles:
    - role: course_setup_scripts
