---
# always - every other play needs the inventory, even with --tags
- name: Load inventory from Terraform
  import_playbook: playbooks/00_setup_inventory.yaml
  tags: always

- name: Upgrade Ubuntu
  hosts: control_nodes:worker_nodes
  become: true
  # the venv custom_ansible_venv creates (and group_vars/all's global
  # ansible_python_interpreter default) doesn't exist yet at this point
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tags: upgrade_ubuntu
  roles:
    - role: upgrade_ubuntu

- name: Create ansible venv
  hosts: control_nodes:worker_nodes
  become: true
  # same as above - this play is what creates the venv in the first place
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tags: custom_ansible_venv
  roles:
    - role: custom_ansible_venv

- name: Configure Linux Kenel Settings
  hosts: control_nodes:worker_nodes
  become: true
  tags: configure_linux_kernel_settings
  roles:
    - role: configure_linux_kernel_settings

- name: Configure /etc/hosts
  hosts: control_nodes:worker_nodes
  become: true
  tags: configure_etc_hosts
  roles:
    - role: configure_etc_hosts

- name: Configure course user
  hosts: control_nodes:worker_nodes
  become: true
  tags: course_user
  roles:
    - role: course_user

- name: Clone course repository
  hosts: control_nodes:worker_nodes
  become: true
  tags: clone_course_repo
  roles:
    - role: clone_course_repo

- name: Run course setup scripts
  hosts: control_nodes:worker_nodes
  become: true
  tags: course_setup_scripts
  roles:
    - role: course_setup_scripts

# last, so the README only shows up once the nodes are ready for kubeadm
- name: Write README with node access
  hosts: localhost
  connection: local
  gather_facts: false
  # just regenerate it: ansible-playbook 01_setup_cka_cluster.yaml --tags access_readme
  tags: access_readme
  roles:
    - role: access_readme
