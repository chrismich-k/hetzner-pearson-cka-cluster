---
- name: Load inventory from terraform
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read terraform output as json
      command: terraform output -json
      args:
        chdir: "../../terraform"
      register: tf_output_raw
      no_log: true
      check_mode: false

    - name: Convert to ansible fact
      set_fact:
        tf_out: "{{ tf_output_raw.stdout | from_json }}"
      no_log: true

    - name: Build control nodes group
      add_host:
        name: "{{ item.key }}"
        # control_node_bootstrap = the one control node kubeadm init runs on
        groups: "{{ ['control_nodes'] + (['control_node_bootstrap'] if item.key == tf_out.primary_control_node.value else []) }}"
        ansible_host: "{{ item.value.ipv4 | default(item.value.ipv6, true) }}"
        ansible_ssh_private_key_file: "{{ item.value.ssh_key_path }}"
        ipv4: "{{ item.value.ipv4 }}"
        ipv6: "{{ item.value.ipv6 }}"
        provider_id: "{{ item.value.provider_id }}"
        ansible_user: "root"
      loop: "{{ tf_out.control_nodes.value | dict2items }}"

    - name: Build worker nodes group
      add_host:
        name: "{{ item.key }}"
        groups: worker_nodes
        ansible_host: "{{ item.value.ipv4 | default(item.value.ipv6, true) }}"
        ansible_ssh_private_key_file: "{{ item.value.ssh_key_path }}"
        ipv4: "{{ item.value.ipv4 }}"
        ipv6: "{{ item.value.ipv6 }}"
        provider_id: "{{ item.value.provider_id }}"
        ansible_user: "root"
      loop: "{{ tf_out.worker_nodes.value | dict2items }}"

    # replaces the manual "ssh once into every server and type yes": fetch
    # each node's host key and (re)write its known_hosts entry. A rebuilt
    # server with a new key on the same IP gets its stale entry replaced
    # instead of tripping "REMOTE HOST IDENTIFICATION HAS CHANGED"
    - name: Wait for sshd on all nodes
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        search_regex: OpenSSH
        timeout: 300
      loop: "{{ groups['control_nodes'] + groups['worker_nodes'] }}"

    - name: Scan host keys of all nodes
      ansible.builtin.command: "ssh-keyscan -t ed25519 {{ hostvars[item].ansible_host }}"
      register: host_keys
      changed_when: false
      check_mode: false
      loop: "{{ groups['control_nodes'] + groups['worker_nodes'] }}"

    - name: Add host keys to known_hosts
      ansible.builtin.known_hosts:
        name: "{{ hostvars[item.item].ansible_host }}"
        key: "{{ item.stdout }}"
        state: present
      loop: "{{ host_keys.results }}"
      loop_control:
        label: "{{ item.item }}"
